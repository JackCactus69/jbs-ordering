<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JBS Ordering Guide – Mobile UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root {
      --bg: #f8fafc;
      --ink: #111827;
      --muted: #6b7280;
      --line: #d1d5db;
      --soft: #f3f4f6;
      --black: #050505;
      --charcoal: #171717;
      --gold: #d4a017;
      --gold-bright: #facc15;
      --gold-soft: #fff8df;
      --blue-head: #9bbff3;
      --danger: #b91c1c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 1rem 1rem 5.75rem;
      background: #fff;
    }

    .brand-header {
      text-align: center;
      padding: 0.35rem 0 0.8rem;
    }

    .brand-mark {
      font-weight: 900;
      font-size: 2rem;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .brand-mark .gold {
      color: var(--gold);
      font-style: italic;
      margin-left: 0.2rem;
    }

    .brand-sub {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.55rem;
      margin-top: 0.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-sub::before,
    .brand-sub::after {
      content: "";
      width: 3rem;
      height: 2px;
      background: var(--gold);
      display: inline-block;
    }

    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--line);
      border-radius: 0.8rem;
      overflow: hidden;
      background: #fff;
      margin: 0.35rem 0 1rem;
    }

    .mode-btn {
      border: 0;
      padding: 0.7rem 0.5rem;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--black);
      color: var(--gold-bright);
    }

    .location-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    .location-card {
      border: 1.5px solid #262626;
      border-radius: 1rem;
      min-height: 8.1rem;
      background: linear-gradient(145deg, #232323, #050505);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
    }

    .location-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 2px solid transparent;
      pointer-events: none;
    }

    .location-card.has-active::after,
    .location-card:focus::after {
      border-color: var(--gold-bright);
    }

    .location-icon {
      font-size: 2.25rem;
      color: var(--gold-bright);
      line-height: 1;
    }

    .location-title {
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1;
    }

    .location-count,
    .location-active-count {
      color: var(--gold-bright);
      font-weight: 800;
      font-size: 0.9rem;
    }

    .location-active-count {
      background: rgba(250,204,21,0.12);
      border-radius: 999px;
      padding: 0.12rem 0.45rem;
      margin-top: 0.1rem;
    }

    .section-card {
      margin-top: 1rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: #fff;
      overflow: hidden;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-weight: 900;
      padding: 0.8rem 0.85rem 0.45rem;
    }

    .section-title .icon {
      color: var(--gold);
    }

    textarea {
      display: block;
      width: calc(100% - 1.7rem);
      margin: 0 0.85rem 0.85rem;
      min-height: 5.75rem;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 0.7rem;
      background: #fff;
      color: var(--ink);
    }

    .prep-sheet {
      margin: 0 0.7rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 0.8rem;
      overflow: hidden;
      background: #fff;
    }

    .prep-head {
      text-align: center;
      padding: 0.9rem 0.7rem 0.75rem;
      background: #fff;
    }

    .prep-logo {
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      line-height: 1.05;
    }

    .prep-logo .runner {
      display: block;
      font-size: 1.35rem;
      transform: rotate(-7deg);
    }

    .prep-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      margin: 0.5rem 0 0.45rem;
      letter-spacing: 0.03em;
      color: #4b5563;
    }

    .prep-lines {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.35rem 0.45rem;
      align-items: end;
      max-width: 250px;
      margin: 0 auto;
      font-size: 0.7rem;
    }

    .prep-line {
      border-bottom: 1px solid #111827;
      min-height: 1rem;
      text-align: left;
      padding-left: 0.2rem;
    }

    .prep-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      table-layout: fixed;
    }

    .prep-table th {
      background: var(--blue-head);
      color: #111827;
      text-align: left;
      padding: 0.6rem 0.45rem;
      border: 1px solid #aeb8c7;
      font-size: 0.68rem;
      text-transform: uppercase;
    }

    .prep-table td {
      border: 1px solid #d1d5db;
      padding: 0.4rem 0.45rem;
      vertical-align: middle;
      background: #fff;
    }

    .prep-table tr.gray-row td {
      background: #d9d9d9;
    }

    .prep-table .done-cell {
      text-align: center;
      width: 3.4rem;
    }

    .prep-table .notes-cell {
      width: 34%;
    }

    .prep-table input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--gold);
    }

    .prep-note-input {
      width: 100%;
      border: 0;
      background: transparent;
      outline: none;
      color: var(--ink);
      font-size: 0.72rem;
    }

    .prep-preview-note {
      margin: 0 0.85rem 0.85rem;
      border: 1px solid #f0c453;
      background: var(--gold-soft);
      border-radius: 0.75rem;
      padding: 0.65rem 0.75rem;
      font-size: 0.78rem;
      color: #4b5563;
    }

    .bottom-actions {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(520px, 100vw);
      padding: 0.65rem 1rem calc(0.65rem + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.6rem;
      border-top: 1px solid #e5e7eb;
      z-index: 40;
    }

    .action-btn {
      border: 0;
      border-radius: 0.8rem;
      min-height: 3.1rem;
      background: var(--black);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.16);
    }

    .action-btn.gold {
      background: var(--gold-bright);
      color: #111827;
    }

    .small-status {
      margin-top: 0.7rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(0,0,0,0.72);
      z-index: 80;
    }

    .modal.open {
      display: block;
    }

    .modal-panel {
      position: absolute;
      inset: 0;
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      background: linear-gradient(135deg, #111, #1f2937);
      color: #fff;
      padding: calc(0.9rem + env(safe-area-inset-top)) 1rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 1.65rem;
      font-weight: 950;
      line-height: 1;
    }

    .modal-close {
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 2rem;
      line-height: 1;
      padding: 0.15rem 0.25rem;
      cursor: pointer;
    }

    .search-wrap {
      padding: 0.75rem 0.85rem;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .search-wrap input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      padding: 0.7rem 0.85rem;
      background: #fff;
      color: var(--ink);
      font-size: 0.95rem;
    }

    .item-list {
      flex: 1;
      overflow: auto;
      padding: 0.8rem;
      background: #f8fafc;
    }

    .item-card {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 0.7rem;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: #fff;
      padding: 0.65rem;
      margin-bottom: 0.75rem;
      min-height: 6.2rem;
    }

    .item-card.has-value {
      background: linear-gradient(90deg, #fff9db, #fff);
      border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(212,160,23,0.18);
    }

    .product-thumb,
    .product-fallback {
      width: 72px;
      height: 72px;
      border-radius: 0.8rem;
      object-fit: contain;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
    }

    .product-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-weight: 900;
      font-size: 1.1rem;
    }

    .item-name {
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 0.35rem;
    }

    .needs-dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 999px;
      background: var(--gold);
      margin-left: 0.35rem;
      vertical-align: middle;
    }

    .item-meta {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
    }

    .qty-stepper {
      display: grid;
      grid-template-columns: 2.45rem 2.7rem 2.45rem;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
    }

    .qty-btn {
      border: 0;
      width: 2.45rem;
      height: 2.45rem;
      border-radius: 0.55rem;
      background: #e5e7eb;
      color: #111827;
      font-size: 1.65rem;
      line-height: 1;
      cursor: pointer;
    }

    .qty-btn:active {
      background: var(--gold-bright);
      transform: translateY(1px);
    }

    .qty-value {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .item-card.has-value .qty-value {
      color: #a16207;
    }

    .empty-list {
      padding: 1.5rem;
      color: var(--muted);
      text-align: center;
    }

    .review-list {
      flex: 1;
      overflow: auto;
      padding: 0.85rem;
      background: #f8fafc;
    }

    .review-group {
      margin-bottom: 1rem;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      overflow: hidden;
      background: #fff;
    }

    .review-group h3 {
      margin: 0;
      padding: 0.65rem 0.75rem;
      background: var(--black);
      color: var(--gold-bright);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .review-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      padding: 0.58rem 0.75rem;
      border-top: 1px solid #e5e7eb;
      align-items: center;
    }

    .review-qty {
      font-weight: 900;
      background: var(--gold-bright);
      color: #111827;
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
      min-width: 2rem;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(5.25rem + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(140%);
      background: #111827;
      color: #fff;
      padding: 0.65rem 0.9rem;
      border-radius: 999px;
      font-size: 0.86rem;
      z-index: 120;
      transition: transform 0.2s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,0.28);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 420px) {
      .app-shell {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }

      .brand-mark {
        font-size: 1.75rem;
      }

      .location-card {
        min-height: 7.2rem;
      }

      .item-card {
        grid-template-columns: 58px 1fr;
        grid-template-areas:
          "img info"
          "step step";
      }

      .product-thumb,
      .product-fallback {
        grid-area: img;
        width: 58px;
        height: 58px;
      }

      .item-info {
        grid-area: info;
      }

      .qty-stepper {
        grid-area: step;
        justify-self: stretch;
        grid-template-columns: 3.1rem 1fr 3.1rem;
        margin-top: 0.3rem;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="brand-header">
      <div class="brand-mark">JewBoy<span class="gold">Sliders</span></div>
      <div class="brand-sub">East Sixth</div>
    </header>

    <nav class="mode-toggle" aria-label="Ordering view">
      <button type="button" class="mode-btn active" data-mode="weekday">Weekday</button>
      <button type="button" class="mode-btn" data-mode="weekend">Weekend</button>
    </nav>

    <section class="location-grid" id="locationGrid" aria-label="Restaurant locations"></section>

    <section class="section-card">
      <div class="section-title"><span class="icon">▣</span> Shift Notes</div>
      <textarea id="shiftNote" placeholder="Add notes about the shift, inventory, issues, or special instructions..."></textarea>
    </section>

    <section class="section-card">
      <div class="section-title"><span class="icon">▤</span> Prep List</div>
      <div class="prep-sheet">
        <div class="prep-head">
          <div class="prep-logo"><span class="runner">➟</span> JEWBOY<br />sliders</div>
          <div class="prep-title">-PREP LIST-</div>
          <div class="prep-lines">
            <span>DATE:</span><span class="prep-line" id="prepDateLine"></span>
            <span>SIGNATURE:</span><span class="prep-line"></span>
          </div>
        </div>
        <table class="prep-table">
          <thead>
            <tr>
              <th>Task</th>
              <th class="done-cell">Done</th>
              <th class="notes-cell">Notes</th>
            </tr>
          </thead>
          <tbody id="prepListBody"></tbody>
        </table>
      </div>
      <div class="prep-preview-note">Review shows only non-zero order items, grouped by location. Prep List saves and exports with the sheet.</div>
    </section>

    <div class="small-status" id="savedInfo">Saved sheets on this device: 0</div>
  </main>

  <div class="bottom-actions">
    <button type="button" class="action-btn" id="saveBtn">Save</button>
    <button type="button" class="action-btn gold" id="reviewBtn">Review</button>
    <button type="button" class="action-btn" id="exportPrettyBtn">Export</button>
  </div>

  <div class="modal" id="sectionModal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="sectionTitle">
      <div class="modal-header">
        <div class="modal-title" id="sectionTitle">Walk-In</div>
        <button type="button" class="modal-close" id="closeSectionBtn" aria-label="Close section">×</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="sectionSearch" placeholder="Search items..." />
      </div>
      <div class="item-list" id="itemList"></div>
    </div>
  </div>

  <div class="modal" id="reviewModal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
      <div class="modal-header">
        <div class="modal-title" id="reviewTitle">Review Order</div>
        <button type="button" class="modal-close" id="closeReviewBtn" aria-label="Close review">×</button>
      </div>
      <div class="review-list" id="reviewList"></div>
      <div class="bottom-actions" style="position:static; transform:none; width:100%; max-width:none;">
        <button type="button" class="action-btn" id="reviewSaveBtn">Save</button>
        <button type="button" class="action-btn gold" id="reviewExportBtn">Export</button>
        <button type="button" class="action-btn" id="reviewBackBtn">Back</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

    function escapeHtml(value) {
      var s = value == null ? "" : String(value);
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function formatNumber(n) {
      n = Number(n || 0);
      if (!isFinite(n)) return "";
      if (Math.abs(n - Math.round(n)) < 0.00001) return String(Math.round(n));
      return String(Math.round(n * 100) / 100);
    }

    function applyIncrement(value, increment) {
      var v = Number(value || 0);
      var inc = Number(increment || 0);
      if (!isFinite(v) || v <= 0) return 0;
      if (!isFinite(inc) || inc <= 0) return v;
      return Math.ceil(v / inc) * inc;
    }

    function stepForItem(item) {
      var inc = Number(item && item.increment);
      return (isFinite(inc) && inc > 0) ? inc : 1;
    }

    function sortedItemIndexes(location) {
      var indexes = ITEMS.map(function(item, index) { return index; });
      indexes.sort(function(ai, bi) {
        var a = ITEMS[ai], b = ITEMS[bi];
        var la = a.location || "Other";
        var lb = b.location || "Other";
        var pa = LOCATION_ORDER.indexOf(la);
        var pb = LOCATION_ORDER.indexOf(lb);
        if (pa === -1) pa = LOCATION_ORDER.length;
        if (pb === -1) pb = LOCATION_ORDER.length;
        if (pa !== pb) return pa - pb;

        var nameA = String(a.item || "").toLowerCase();
        var nameB = String(b.item || "").toLowerCase();

        if (la === "Walk-In") {
          function cheeseRank(name) {
            if (name.indexOf("american cheese") !== -1) return 0;
            if (name.indexOf("pepperjack") !== -1) return 1;
            return 2;
          }
          var ca = cheeseRank(nameA), cb = cheeseRank(nameB);
          if (ca !== cb) return ca - cb;
        }

        if (la === "Shed") {
          function gloveRank(name) {
            if (name.indexOf("x-large gloves") !== -1) return 0;
            if (name.indexOf("large gloves") !== -1) return 1;
            if (name.indexOf("medium gloves") !== -1) return 2;
            return 3;
          }
          var ga = gloveRank(nameA), gb = gloveRank(nameB);
          if (ga !== gb) return ga - gb;
        }

        return String(a.item || "").localeCompare(String(b.item || ""));
      });

      if (location) {
        indexes = indexes.filter(function(index) {
          return (ITEMS[index].location || "Other") === location;
        });
      }
      return indexes;
    }

        card.className = "item-card" + (qty > 0 ? " has-value" : "");
        card.setAttribute("data-index", index);

        var imgHtml = img
          ? '<img class="product-thumb" src="' + escapeHtml(img) + '" alt="" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';" /><div class="product-fallback" style="display:none;">' + escapeHtml(prettyItemName(item.item).slice(0, 2).toUpperCase()) + '</div>'
          : '<div class="product-fallback">' + escapeHtml(prettyItemName(item.item).slice(0, 2).toUpperCase()) + '</div>';

        card.innerHTML =
          imgHtml +
          '<div class="item-info">' +
            '<div class="item-name">' + escapeHtml(prettyItemName(item.item)) + (qty > 0 ? '<span class="needs-dot"></span>' : '') + '</div>' +
            '<div class="item-meta">Par: ' + escapeHtml(formatNumber(par)) + ' · Unit: ' + escapeHtml(item.unit || "") + '</div>' +
          '</div>' +
          '<div class="qty-stepper">' +
            '<button type="button" class="qty-btn" data-action="minus" aria-label="Decrease">−</button>' +
            '<span class="qty-value">' + escapeHtml(formatNumber(qty) || "0") + '</span>' +
            '<button type="button" class="qty-btn" data-action="plus" aria-label="Increase">+</button>' +
          '</div>';

        list.appendChild(card);
      });
    }

    function setMode(mode) {
      currentMode = mode === "weekend" ? "weekend" : "weekday";
      document.querySelectorAll(".mode-btn").forEach(function(btn) {
        btn.classList.toggle("active", btn.getAttribute("data-mode") === currentMode);
      });
      buildLocations();
      renderItemList();
    }

    function openSection(location) {
      activeLocation = location;
      var modal = document.getElementById("sectionModal");
      var title = document.getElementById("sectionTitle");
      var search = document.getElementById("sectionSearch");
      if (title) title.textContent = location;
      if (search) search.value = "";
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      renderItemList();
    }

    function closeSection() {
      activeLocation = null;
      var modal = document.getElementById("sectionModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    function buildEntries() {
      return ITEMS.map(function(item, index) {
        return {
          item: item.item,
          unit: item.unit || "",
          location: item.location || "Other",
          weekdayPar: Number(item.weekdayPar || 0),
          weekendPar: Number(item.weekendPar || 0),
          weekdayOrder: Number(orderState[index].weekday || 0),
          weekendOrder: Number(orderState[index].weekend || 0)
        };
      });
    }

    function getCurrentSheetObject() {
      var noteEl = document.getElementById("shiftNote");
      return {
        timestamp: new Date().toISOString(),
        viewMode: currentMode,
        note: noteEl ? noteEl.value : "",
        prepList: getPrepState(),
        entries: buildEntries()
      };
    }

    function loadHistory() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (err) {
        return [];
      }
    }

    function saveHistory(history) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      updateSavedInfo();
    }

    function updateSavedInfo() {
      var el = document.getElementById("savedInfo");
      var count = loadHistory().length;
      if (el) el.textContent = "Saved sheets on this device: " + count;
    }

    function saveCurrentSheet() {
      var history = loadHistory();
      history.push(getCurrentSheetObject());
      saveHistory(history);
      showToast("Saved sheet");
    }

    function activeEntries(sheet) {
      var mode = sheet.viewMode || currentMode;
      return (sheet.entries || []).filter(function(entry) {
        return Number(mode === "weekday" ? entry.weekdayOrder : entry.weekendOrder) > 0;
      });
    }

    function groupedActiveEntries(sheet) {
      var groups = {};
      activeEntries(sheet).forEach(function(entry) {
        var loc = entry.location || "Other";
        if (!groups[loc]) groups[loc] = [];
        groups[loc].push(entry);
      });
      return groups;
    }

    function openReview() {
      var sheet = getCurrentSheetObject();
      var groups = groupedActiveEntries(sheet);
      var review = document.getElementById("reviewList");
      review.innerHTML = "";

      var any = false;
      LOCATION_ORDER.forEach(function(loc) {
        var entries = groups[loc] || [];
        if (!entries.length) return;
        any = true;
        var group = document.createElement("section");
        group.className = "review-group";
        group.innerHTML = '<h3>' + escapeHtml(loc) + '</h3>';
        entries.forEach(function(entry) {
          var qty = sheet.viewMode === "weekday" ? entry.weekdayOrder : entry.weekendOrder;
          group.innerHTML += '<div class="review-row"><span>' + escapeHtml(prettyItemName(entry.item)) + '</span><span class="review-qty">' + escapeHtml(formatNumber(qty)) + '</span></div>';
        });
        review.appendChild(group);
      });

      if (!any) {
        review.innerHTML = '<div class="empty-list">No To Bring quantities yet. Add items with the + button, then review again.</div>';
      }

      var modal = document.getElementById("reviewModal");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeReview() {
      var modal = document.getElementById("reviewModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    function makeDateFilename(prefix, mode) {
      return prefix + "_" + mode + "_" + todayString() + ".html";
    }

    function exportPrintableSheet() {
      var sheet = getCurrentSheetObject();
      var mode = sheet.viewMode || currentMode;
      var modeLabel = mode === "weekend" ? "Weekend" : "Weekday";
      var groups = groupedActiveEntries(sheet);

      var parts = [];
      parts.push('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JewBoy Sliders Order Sheet</title>');
      parts.push('<style>');
      parts.push('body{margin:0;padding:1rem;background:#fff;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}');
      parts.push('h1{margin:0;font-size:1.4rem;} .sub{color:#6b7280;font-size:.85rem;margin:.15rem 0 .7rem;}');
      parts.push('.brand{border-bottom:4px solid #d4a017;padding-bottom:.6rem;margin-bottom:.8rem;}');
      parts.push('.note{border-left:4px solid #d4a017;background:#fffbeb;padding:.6rem .75rem;margin:.75rem 0 1rem;white-space:pre-wrap;}');
      parts.push('table{border-collapse:collapse;width:100%;font-size:.82rem;margin-bottom:1.25rem;} th{background:#000;color:#fff;text-transform:uppercase;font-size:.68rem;letter-spacing:.08em;text-align:left;padding:.35rem;} td{border:1px solid #e5e7eb;padding:.35rem;} tr:nth-child(even) td{background:#f9fafb;} td.to-bring{background:#facc15!important;font-weight:800;color:#111827;} .dot{display:inline-block;width:.45rem;height:.45rem;background:#d4a017;border-radius:999px;margin-left:.35rem;}');
      parts.push('.loc{margin-top:1rem;font-weight:900;color:#d4a017;text-transform:uppercase;border-bottom:2px solid #d4a017;padding-bottom:.2rem;}');
      parts.push('.prep-wrap{page-break-before:always;margin-top:1.5rem;} .prep-head{text-align:center;margin:1rem 0;} .prep-logo{font-weight:900;line-height:1.05;} .runner{font-size:2rem;display:block;} .prep-title{font-family:Georgia,serif;font-size:1.7rem;color:#4b5563;margin:.8rem 0;} .prep-lines{display:grid;grid-template-columns:auto 1fr;gap:.45rem;max-width:360px;margin:0 auto;font-size:.8rem;} .prep-line{border-bottom:1px solid #111827;min-height:1.1rem;} .prep-table th{background:#9bbff3;color:#111827;} .prep-table td.gray{background:#d9d9d9;} .check{font-size:1rem;text-align:center;}');
      parts.push('</style></head><body>');
      parts.push('<div class="brand"><h1>JewBoy Sliders – Order Sheet</h1><div class="sub">' + escapeHtml(BRANDING.locationName) + ' · ' + escapeHtml(modeLabel) + ' · ' + escapeHtml(new Date().toLocaleString()) + '</div></div>');
      parts.push('<div class="note"><strong>Shift Notes</strong><br>' + escapeHtml(sheet.note || "(none)") + '</div>');

      var hadEntries = false;
      LOCATION_ORDER.forEach(function(loc) {
        var entries = groups[loc] || [];
        if (!entries.length) return;
        hadEntries = true;
        parts.push('<div class="loc">' + escapeHtml(loc) + '</div>');
        parts.push('<table><thead><tr><th>Item</th><th>Par</th><th>To Bring</th></tr></thead><tbody>');
        entries.forEach(function(entry) {
          var par = mode === "weekday" ? entry.weekdayPar : entry.weekendPar;
          var qty = mode === "weekday" ? entry.weekdayOrder : entry.weekendOrder;
          parts.push('<tr><td>' + escapeHtml(prettyItemName(entry.item)) + '<span class="dot"></span></td><td>' + escapeHtml(formatNumber(par)) + '</td><td class="to-bring">' + escapeHtml(formatNumber(qty)) + '</td></tr>');
        });
        parts.push('</tbody></table>');
      });

      if (!hadEntries) {
        parts.push('<p>No items were selected for this order.</p>');
      }

      parts.push('<div class="prep-wrap">');
      parts.push('<div class="prep-head"><div class="prep-logo"><span class="runner">➟</span>JEWBOY<br>sliders</div><div class="prep-title">-PREP LIST-</div><div class="prep-lines"><span>DATE:</span><span class="prep-line">' + escapeHtml(todayString()) + '</span><span>SIGNATURE:</span><span class="prep-line"></span></div></div>');
      parts.push('<table class="prep-table"><thead><tr><th>Task</th><th>Done</th><th>Notes</th></tr></thead><tbody>');
      (sheet.prepList || []).forEach(function(row) {
        parts.push('<tr><td class="' + (row.gray ? 'gray' : '') + '">' + escapeHtml(row.task) + '</td><td class="check">' + (row.done ? '☑' : '☐') + '</td><td>' + escapeHtml(row.notes || '') + '</td></tr>');
      });
      parts.push('</tbody></table></div>');
      parts.push('</body></html>');

      downloadHtml(parts.join(''), makeDateFilename("jbs_order_sheet_printable", mode));
    }

    function exportHistory() {
      var history = loadHistory();
      if (!history.length) {
        alert("No saved sheets yet.");
        return;
      }

      var parts = [];
      parts.push('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JBS Order History</title>');
      parts.push('<style>body{font-family:system-ui;background:#0f172a;color:#e5e7eb;padding:1rem;} table{border-collapse:collapse;width:100%;margin:1rem 0;} th,td{border:1px solid #334155;padding:.35rem;text-align:left;} th{background:#020617;} .prep{color:#facc15;}</style></head><body>');
      parts.push('<h1>JBS Order History</h1>');
      history.forEach(function(sheet, i) {
        parts.push('<h2>Sheet ' + (i + 1) + ' — ' + escapeHtml(sheet.timestamp || '') + '</h2>');
        parts.push('<p>View: ' + escapeHtml(sheet.viewMode || '') + '</p>');
        if (sheet.note) parts.push('<p><strong>Notes:</strong> ' + escapeHtml(sheet.note) + '</p>');
        parts.push('<table><thead><tr><th>Location</th><th>Item</th><th>Weekday Qty</th><th>Weekend Qty</th></tr></thead><tbody>');
        (sheet.entries || []).forEach(function(entry) {
          if (!Number(entry.weekdayOrder || 0) && !Number(entry.weekendOrder || 0)) return;
          parts.push('<tr><td>' + escapeHtml(entry.location || '') + '</td><td>' + escapeHtml(prettyItemName(entry.item)) + '</td><td>' + escapeHtml(formatNumber(entry.weekdayOrder)) + '</td><td>' + escapeHtml(formatNumber(entry.weekendOrder)) + '</td></tr>');
        });
        parts.push('</tbody></table>');
        parts.push('<p class="prep"><strong>Prep list saved:</strong> ' + ((sheet.prepList || []).length) + ' tasks</p>');
      });
      parts.push('</body></html>');
      downloadHtml(parts.join(''), makeDateFilename("jbs_order_history", currentMode));
    }

    function downloadHtml(content, filename) {
      var blob = new Blob([content], { type: "text/html" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function showToast(message) {
      var toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(function() {
        toast.classList.remove("show");
      }, 1800);
    }

    function initEvents() {
      document.querySelectorAll(".mode-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          setMode(btn.getAttribute("data-mode"));
        });
      });

      document.getElementById("closeSectionBtn").addEventListener("click", closeSection);
      document.getElementById("sectionModal").addEventListener("click", function(e) {
        if (e.target.id === "sectionModal") closeSection();
      });

      document.getElementById("sectionSearch").addEventListener("input", renderItemList);

      document.getElementById("itemList").addEventListener("click", function(e) {
        var btn = e.target.closest(".qty-btn");
        if (!btn) return;
        var card = btn.closest(".item-card");
        var index = Number(card.getAttribute("data-index"));
        var item = ITEMS[index];
        var step = stepForItem(item);
        var current = getQty(index, currentMode);
        var delta = btn.getAttribute("data-action") === "plus" ? step : -step;
        var next = current + delta;
        if (next < 0) next = 0;
        if (next > 0) next = applyIncrement(next, item.increment);
        setQty(index, currentMode, next);
        buildLocations();
        renderItemList();
      });

      document.getElementById("saveBtn").addEventListener("click", saveCurrentSheet);
      document.getElementById("reviewBtn").addEventListener("click", openReview);
      document.getElementById("exportPrettyBtn").addEventListener("click", exportPrintableSheet);

      document.getElementById("closeReviewBtn").addEventListener("click", closeReview);
      document.getElementById("reviewBackBtn").addEventListener("click", closeReview);
      document.getElementById("reviewSaveBtn").addEventListener("click", function() { saveCurrentSheet(); closeReview(); });
      document.getElementById("reviewExportBtn").addEventListener("click", exportPrintableSheet);
      document.getElementById("reviewModal").addEventListener("click", function(e) {
        if (e.target.id === "reviewModal") closeReview();
      });

      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
          closeSection();
          closeReview();
        }
      });
    }

    document.addEventListener("DOMContentLoaded", function() {
      buildPrepList();
      updatePrepDateLine();
      buildLocations();
      updateSavedInfo();
      initEvents();
    });
  </script>
</body>
</html>
